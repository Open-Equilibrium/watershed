name: liquid
description: "Liquid, the Watershed workspace app."
publish_to: 'none'
version: 0.0.0

environment:
  sdk: ^3.13.5
  # The exact Flutter release; CI reads it from here (ADR-0193).
  flutter: 3.47.7

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  liquid_bridge:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
