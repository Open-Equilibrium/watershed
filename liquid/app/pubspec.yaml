name: liquid
description: "Liquid, the Watershed workspace app."
publish_to: 'none'
version: 0.0.0

environment:
  sdk: ^3.13.5
  # The exact Flutter release; CI reads it from here.
  flutter: 3.47.9

dependencies:
  desktop_drop: 0.8.4
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  intl: ^0.20.3
  logging: ^1.3.0
  perfect_freehand: 2.5.2+1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Ships the license notices of bundled third-party material inside every app bundle.
  assets:
    - assets/fonts/LICENSE-lucide
    - assets/fonts/LICENSE-excalifont
    - assets/licenses/LICENSE-roughjs
  fonts:
    - family: Lucide
      fonts:
        - asset: assets/fonts/lucide.ttf
    - family: Excalifont
      fonts:
        - asset: assets/fonts/excalifont.ttf
