[package]
# cargokit derives the library file name from the package name, so it keeps an underscore.
name = "liquid_bridge"
description = "Bridge between the Liquid Flutter app and the Meta-Harness core (ADR-0186)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge.workspace = true
meta-harness-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
