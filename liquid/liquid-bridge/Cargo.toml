[package]
name = "liquid_bridge"
description = "Bridge between the Liquid Flutter app and its Rust cores: Meta-Harness and the Workspace (ADR-0186)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge.workspace = true
getrandom.workspace = true
keyring.workspace = true
liquid-core.workspace = true
liquid-storage.workspace = true
meta-harness-core.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
