# The process-death matrix runs child processes and durable writes for minutes; holding two test
# threads keeps its load beside at most one other test on a three-core runner, so it cannot push
# other tests past their Git deadlines while the rest of the suite still moves on.
[[profile.default.overrides]]
filter = 'test(crash_matrix)'
threads-required = 2

# Each of these tests starts its own pinned T3 Code server, about 500 MB each; two at a time keep a
# small CI runner from pushing a server's start past its 30 s deadline. They start first, with the
# longest Liquid test, so none of them is left running alone at the end.
[test-groups]
t3-server = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'binary(t3_contract) | (package(liquid_bridge) & test(/^tests::agent::/))'
test-group = 't3-server'
priority = 100

[[profile.default.overrides]]
filter = 'test(/ten_boards_of_elements/)'
priority = 100
