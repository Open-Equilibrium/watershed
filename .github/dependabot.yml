version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: pub
    directory: /liquid/app
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      pub:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
