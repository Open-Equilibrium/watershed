name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  m1:
    name: M1 gates (${{ matrix.os }}) [${{ github.event_name }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Validate Codex harness
        run: node scripts/run-python.mjs -m unittest discover -s tests -p "test_*.py"

      - name: Install Rust
        run: >-
          rustup toolchain install 1.97.0
          --profile minimal
          --component clippy
          --component rustfmt
          --component llvm-tools-preview

      - name: Install gate tools
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-audit,cargo-deny,lychee@0.24.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: >-
          cargo nextest run
          --locked
          --workspace
          --all-targets

      - name: Run optimized performance tests
        run: >-
          cargo nextest run
          --locked
          -p loop-agent-core
          --release
          --run-ignored ignored-only
          -j 1

      - name: Check line coverage
        run: >-
          cargo llvm-cov nextest
          --locked
          --workspace
          --fail-under-lines 90
          --ignore-filename-regex '(^|[\\/])(tests?|src[\\/]tests\.rs)([\\/]|$)'
          --show-missing-lines

      - name: Check RustSec advisories
        run: cargo audit

      - name: Check dependency policy
        run: cargo deny check

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node dev tools
        run: pnpm install --frozen-lockfile

      - name: Render HTML docs
        run: pnpm run docs:render-check

      - name: Check documentation links
        run: >-
          lychee
          --no-progress
          --include-fragments
          README.md
          PLAN.md
          VISION.md
          PROTOCOL.md
          SECURITY.md
          TESTING.md
          PERFORMANCE.md
          GLOSSARY.md
          CONTRIBUTING.md
          CHANGELOG.md
          docs/**/*.html
