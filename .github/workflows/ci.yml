name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  m1:
    name: M1 gates (${{ matrix.os }}) [${{ github.event_name }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Codex harness
        run: node scripts/run-python.mjs -m unittest discover -s tests -p "test_*.py"

      - name: Install Rust
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component clippy
          --component rustfmt
          --component llvm-tools-preview

      - name: Install gate tools
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-nextest@0.9.140,cargo-llvm-cov@0.8.7,cargo-audit@0.22.2,cargo-deny@0.20.2,lychee@0.24.2

      - name: Check formatting
        shell: pwsh
        run: |
          $rustSources = @(git ls-files -- '*.rs')
          rustfmt --edition 2024 --check @rustSources

      - name: Check lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: >-
          cargo nextest run
          --locked
          --workspace
          --all-targets

      - name: Run optimized performance tests
        if: matrix.os == 'ubuntu-24.04'
        run: >-
          cargo nextest run
          --locked
          -p loop-agent-core
          --release
          --run-ignored ignored-only
          -j 1

      - name: Check line coverage
        run: >-
          cargo llvm-cov nextest
          --locked
          --workspace
          --fail-under-lines 90
          --ignore-filename-regex '(^|[\\/])(tests?|src[\\/]tests\.rs)([\\/]|$)'
          --show-missing-lines

      - name: Check RustSec advisories
        run: cargo audit

      - name: Check dependency policy
        run: cargo deny check

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node dev tools
        run: pnpm install --frozen-lockfile

      - name: Render HTML docs
        run: pnpm run docs:render-check

      - name: Check documentation links
        run: >-
          lychee
          --no-progress
          --include-fragments
          README.md
          PLAN.md
          VISION.md
          PROTOCOL.md
          SECURITY.md
          TESTING.md
          PERFORMANCE.md
          GLOSSARY.md
          CONTRIBUTING.md
          CODE_OF_CONDUCT.md
          CHANGELOG.md
          meta-harness/README.md
          liquid/README.md
          docs/**/*.html
