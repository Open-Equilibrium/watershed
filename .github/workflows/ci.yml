name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

env:
  PERF_TEST_FILTER: 'test(fsm_transition_p95_stays_under_m1_budget) | test(near_cap_event_validation_enforces_m1_memory_budget) | test(noop_dispatch_p95_stays_under_m1_budget) | test(hello_loop_runtime_emit_p95_stays_under_m1_budget) | test(hello_loop_resume_append_p95_stays_under_m1_budget) | test(ten_successful_fixture_loop_invocations_complete_under_m1_runtime_contract) | test(runtime_rejects_duplicate_subloop_work_over_m1_budget)'
  COVERAGE_TEST_FILTER: 'not (test(fsm_transition_p95_stays_under_m1_budget) | test(near_cap_event_validation_enforces_m1_memory_budget) | test(noop_dispatch_p95_stays_under_m1_budget) | test(hello_loop_runtime_emit_p95_stays_under_m1_budget) | test(hello_loop_resume_append_p95_stays_under_m1_budget) | test(ten_successful_fixture_loop_invocations_complete_under_m1_runtime_contract) | test(runtime_rejects_duplicate_subloop_work_over_m1_budget))'

jobs:
  m1:
    name: M1 gates (${{ matrix.os }}) [${{ github.event_name }}]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Validate Codex harness
        run: node scripts/run-python.mjs -m unittest discover -s tests -p "test_*.py"

      - name: Install Rust
        run: >-
          rustup toolchain install 1.81.0
          --profile minimal
          --component clippy
          --component rustfmt
          --component llvm-tools-preview

      - name: Install gate tools
        uses: taiki-e/install-action@c93ccc03e00cd0e08e494f5fd058a6c55a6a1907
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-audit,cargo-deny,lychee

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: >-
          cargo nextest run
          --locked
          --workspace
          --all-targets
          -E '${{ env.COVERAGE_TEST_FILTER }}'

      - name: Run optimized performance tests
        run: >-
          cargo nextest run
          --locked
          -p loop-agent-core
          --release
          -E '${{ env.PERF_TEST_FILTER }}'

      - name: Check line coverage
        run: >-
          cargo llvm-cov nextest
          --locked
          --workspace
          --fail-under-lines 90
          --ignore-filename-regex '(^|[\\/])(tests?|src[\\/]tests\.rs)([\\/]|$)'
          --show-missing-lines
          -E '${{ env.COVERAGE_TEST_FILTER }}'

      - name: Check RustSec advisories
        run: cargo audit

      - name: Check dependency policy
        run: cargo deny check

      - name: Enable Corepack
        run: corepack enable

      - name: Install Node dev tools
        run: pnpm install --frozen-lockfile

      - name: Render HTML docs
        run: pnpm run docs:render-check

      - name: Check documentation links
        run: >-
          lychee
          --no-progress
          --include-fragments
          README.md
          PLAN.md
          VISION.md
          PROTOCOL.md
          SECURITY.md
          TESTING.md
          PERFORMANCE.md
          GLOSSARY.md
          CONTRIBUTING.md
          CHANGELOG.md
          docs/**/*.html
