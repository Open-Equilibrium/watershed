name: CI

on:
  workflow_dispatch:
    inputs:
      mac_self_protection_evaluation:
        description: Run the experimental Mac guard probe (not release proof)
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "test/**"
      - "ci/**"
      - "chore/**"
      - "refactor/**"

# A newer push or pull request update cancels its earlier run; every main commit keeps its own.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Generated, FFI, CLI-argument glue and evidence-only code (TESTING.md coverage gate).
  COVERAGE_EXCLUSIONS: '((^|[\\/])(tests?|src[\\/]tests\.rs)([\\/]|$)|flow-agent[\\/]flow-agent-cli[\\/]src[\\/](main|parsing)\.rs$|flow-agent[\\/]flow-agent-core[\\/]src[\\/]runtime[\\/](m11_budget_evidence|m12_startup_evidence)(\.rs|[\\/])|flow-agent[\\/]flow-agent-core[\\/]src[\\/]runtime[\\/]tool_runner[\\/]unix_process(\.rs|[\\/])|liquid[\\/]liquid-bridge[\\/]src[\\/]frb_generated\.rs$)'

# Each product's gates run in parallel jobs. The scope job classifies the change; jobs whose
# product it did not change are skipped, and the gates job reports the required checks.
jobs:
  scope:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
      product: ${{ steps.scope.outputs.product }}
      flow_agent: ${{ steps.scope.outputs.flow_agent }}
      meta_harness: ${{ steps.scope.outputs.meta_harness }}
      liquid: ${{ steps.scope.outputs.liquid }}
      rust_packages: ${{ steps.scope.outputs.rust_packages }}
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - &node
        name: Install pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Classify product changes
        id: scope
        run: node scripts/ci-product-scope.mjs

  checks:
    name: Checks (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.docs == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    steps:
      - *checkout
      - *node

      - name: Check Node version
        shell: pwsh
        run: |
          $expectedNode = (Get-Content -Raw .node-version).Trim()
          if ((node --version) -ne "v$expectedNode") {
            throw "Node $expectedNode must be active for CI gates"
          }

      - &mac-host
        name: Check native Mac host
        if: matrix.os == 'xcode-27'
        run: node scripts/run-python.mjs -c 'from scripts.m12_native import native_host; native_host()'

      - name: Run repository tooling tests
        run: node scripts/run-python.mjs -m unittest discover -s tests -p "test_*.py"

      - &rust
        name: Select pinned Rust
        if: needs.scope.outputs.product == 'true'
        shell: pwsh
        run: |
          $toolchain = node scripts/run-python.mjs -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $escapedToolchain = [regex]::Escape($toolchain)
          if ((rustc --version) -notmatch "^rustc $escapedToolchain ") {
            throw "Rust $toolchain must be active for CI gates"
          }

      - name: Install check tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,lychee@0.24.2

      - name: Check formatting
        if: needs.scope.outputs.product == 'true'
        shell: pwsh
        run: cargo fmt --all --check

      - name: Check lints
        if: needs.scope.outputs.product == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Check RustSec advisories
        if: needs.scope.outputs.product == 'true'
        run: cargo audit

      - name: Check dependency policy
        if: needs.scope.outputs.product == 'true'
        run: cargo deny check

      - name: Install pinned Corepack
        shell: pwsh
        run: |
          $toolsRoot = Join-Path $env:RUNNER_TEMP watershed-node-tools
          npm install --global --prefix $toolsRoot corepack@0.36.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolsBin = Join-Path $toolsRoot bin
          $toolsBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Enable Corepack
        shell: pwsh
        run: |
          corepack enable
          $packageManager = (Get-Content -Raw package.json | ConvertFrom-Json).packageManager
          $expectedPnpm = $packageManager -replace '^pnpm@', ''
          if ((pnpm --version) -ne $expectedPnpm) {
            throw "pnpm $expectedPnpm must be active for CI gates"
          }

      - name: Install Node dev tools
        run: pnpm install --frozen-lockfile --config.minimum-release-age-exclude=clawpatch@0.8.2

      - name: Check Node advisories
        if: needs.scope.outputs.product == 'true'
        run: pnpm audit

      - name: Render HTML docs
        run: node scripts/check-html-render.mjs

      - name: Check documentation links
        shell: pwsh
        run: |
          $docsJson = node scripts/list-tracked-files.mjs '*.md' '*.html' ':(top,exclude)AGENTS.md' ':(top,exclude).agents/**' ':(top,exclude).codex/**'
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $docs = @($docsJson | ConvertFrom-Json)
          lychee --no-progress --include-fragments -- @docs

      - name: Select minimum Node
        id: minimum-node
        if: needs.scope.outputs.product == 'true' && matrix.os == 'ubuntu-24.04'
        shell: pwsh
        run: |
          $requirement = (Get-Content -Raw package.json | ConvertFrom-Json).engines.node
          if ($requirement -notmatch '^>=(\d+\.\d+\.\d+)$') {
            throw 'The Node requirement must declare one minimum version as >=x.y.z'
          }
          "version=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install minimum Node
        if: needs.scope.outputs.product == 'true' && matrix.os == 'ubuntu-24.04'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.minimum-node.outputs.version }}

      - name: Check minimum Node tooling
        if: needs.scope.outputs.product == 'true' && matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          test "$(node --version)" = "v${{ steps.minimum-node.outputs.version }}"
          node scripts/run-python.mjs -m unittest discover -s tests -p "test_*.py"
          node scripts/check-html-render.mjs

  test:
    name: Tests (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.product == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    env:
      RUST_PACKAGES: ${{ needs.scope.outputs.rust_packages }}
    steps:
      - *checkout
      - *node
      - *mac-host

      - name: Test the Meta-Harness pi extension
        if: needs.scope.outputs.meta_harness == 'true'
        run: node --test meta-harness/pi-extension/watershed.test.ts

      - *rust

      - name: Install test tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1

      - &linux-protection
        name: Provision native Linux protection prerequisites
        if: matrix.os == 'ubuntu-24.04' && needs.scope.outputs.flow_agent == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor
          sudo tee /etc/apparmor.d/watershed-bwrap-userns >/dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>

          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser --replace /etc/apparmor.d/watershed-bwrap-userns
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1

      - name: Run tests
        run: >-
          cargo nextest run
          --no-fail-fast
          --config 'target."cfg(all())".runner = ["node", "../../scripts/run-isolated-rust-test.mjs"]'
          --locked
          $RUST_PACKAGES
          --all-targets
          --all-features

      - name: Run Rustdoc tests
        run: >-
          cargo --config .cargo/test-isolation.toml test
          --locked
          $RUST_PACKAGES
          --all-features
          --doc

      - name: Check Liquid coverage
        if: needs.scope.outputs.liquid == 'true'
        shell: bash
        run: |
          eval "$(cargo llvm-cov show-env --sh)"
          cargo llvm-cov clean --workspace
          cargo nextest run \
            --config 'target."cfg(all())".runner = ["node", "../../scripts/run-isolated-rust-test.mjs"]' \
            --locked -p meta-harness-core -p liquid_bridge --all-targets --all-features
          cargo llvm-cov report --fail-under-lines 88 \
            --ignore-filename-regex "$COVERAGE_EXCLUSIONS" --show-missing-lines

  flow-agent:
    name: Flow Agent acceptance (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.flow_agent == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    steps:
      - *checkout
      - *node
      - *mac-host

      - name: Establish experimental Mac unprotected red control
        if: matrix.os == 'xcode-27' && github.event_name == 'workflow_dispatch' && inputs.mac_self_protection_evaluation
        timeout-minutes: 2
        shell: bash
        run: |
          if python3 scripts/probe-macos-self-protection.py --mode baseline; then
            echo 'Unprotected control unexpectedly satisfied the guard assertions' >&2
            exit 1
          else
            probe_status=$?
            test "$probe_status" -eq 1
          fi

      - name: Evaluate experimental Mac profile and launcher (not release proof)
        if: matrix.os == 'xcode-27' && github.event_name == 'workflow_dispatch' && inputs.mac_self_protection_evaluation
        timeout-minutes: 2
        shell: bash
        run: |
          probe_status=0
          for probe_mode in profile guarded-launch host-build lifecycle-baseline lifecycle; do
            if python3 scripts/probe-macos-self-protection.py --mode "$probe_mode"; then
              result=0
            else
              result=$?
            fi
            printf '%s exit_code=%s\n' "$probe_mode" "$result"
            if (( result > probe_status )); then probe_status=$result; fi
          done
          exit "$probe_status"

      - name: Compare native App Sandbox (not release proof)
        if: matrix.os == 'xcode-27' && github.event_name == 'workflow_dispatch' && inputs.mac_self_protection_evaluation && !cancelled()
        timeout-minutes: 6
        run: python3 scripts/probe-macos-app-sandbox.py

      - name: Run M1.2 installer contract tests
        run: node scripts/run-python.mjs -m unittest install.tests.test_install install.tests.test_readiness

      - name: Run privileged M1.2 installer acceptance
        timeout-minutes: 2
        run: >-
          sudo -n -- /usr/bin/env PATH="$PATH" SUDO_USER="$(id -un)"
          node scripts/run-python.mjs -m unittest
          install.tests.test_readiness.ReadinessContractTest.privileged_installer_acceptance

      - *rust

      - name: Check Flow build targets
        shell: pwsh
        run: |
          $targetTest = Join-Path $env:RUNNER_TEMP flow-build-targets.exe
          rustc --test --edition 2024 --deny warnings flow-agent/build.rs -o $targetTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $targetTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install acceptance tools
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1

      - *linux-protection

      - name: Build native installation artifacts
        shell: bash
        run: |
          cargo build --locked --release -p flow-agent-cli -p flow-agent-executor --target-dir target/m12-standard
          cargo build --locked --release -p flow-agent-cli --features m12-install-acceptance --target-dir target/m12-acceptance
          target/m12-standard/release/flow-executor --probe |
            python3 -c 'import json, sys; probe=json.load(sys.stdin); assert probe["ready"] is True, probe'

      - name: Package native download
        shell: bash
        run: |
          case "$(uname -s)" in
            Linux) platform=ubuntu-24.04-x86_64 ;;
            Darwin) platform=macos-27-aarch64 ;;
            *) exit 1 ;;
          esac
          node scripts/run-python.mjs scripts/package_flow_agent.py \
            --binaries target/m12-standard/release --platform "$platform" \
            --output target/m12-download

      - name: Stage native Executor installation
        shell: python
        run: |
          import os, pathlib, shutil, tempfile
          installation = pathlib.Path(tempfile.mkdtemp(prefix="m12-executor-", dir=os.environ["RUNNER_TEMP"])).resolve()
          executor = installation / "flow-executor"
          # Cargo artifacts can have aliases in deps; install distinct bytes before admission.
          shutil.copyfile("target/m12-standard/release/flow-executor", executor)
          executor.chmod(0o755)
          assert executor.stat().st_nlink == 1
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"M12_INSTALLED_EXECUTOR={executor}\n")

      - name: Run native release Executor acceptance
        shell: bash
        run: |
          FLOW_EXECUTOR_UNDER_TEST="$M12_INSTALLED_EXECUTOR" \
            cargo nextest run --locked -p flow-agent-executor --test native_contract --test native_self_protection

      - name: Run public Custom Executor conformance
        shell: bash
        run: |
          cargo run --locked -p flow-agent-core --features m12-startup-evidence \
            --example custom_executor_conformance -- \
            --executor "$M12_INSTALLED_EXECUTOR"

      - name: Run M1.2 executor startup evidence
        id: m12_startup_evidence
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p target/m12-startup
          cargo run --locked -p flow-agent-core --release \
            --features m12-startup-evidence --example m12_executor_startup \
            -- --executor "$M12_INSTALLED_EXECUTOR" \
            > target/m12-startup/m12-executor-startup.jsonl

      - name: Upload M1.2 executor startup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m12-executor-startup-evidence-${{ matrix.os }}
          path: target/m12-startup/m12-executor-startup.jsonl
          if-no-files-found: error

      - name: Enforce M1.2 executor startup evidence
        if: always() && steps.m12_startup_evidence.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Check native coverage and installation acceptance
        shell: bash
        run: |
          eval "$(cargo llvm-cov show-env --sh)"
          cargo llvm-cov clean --workspace
          cargo build --locked -p flow-agent-cli -p flow-agent-executor
          export M12_COVERAGE_BIN_DIR="$CARGO_LLVM_COV_TARGET_DIR/debug"
          /bin/sh scripts/run-m12-installer-acceptance.sh
          cargo nextest run \
            --config 'target."cfg(all())".runner = ["node", "../../scripts/run-isolated-rust-test.mjs"]' \
            --locked --workspace --all-targets --all-features
          /bin/sh scripts/run-m12-readiness-negatives.sh
          cargo llvm-cov report --fail-under-lines 88 \
            --ignore-filename-regex "$COVERAGE_EXCLUSIONS" --show-missing-lines

      - name: Retain tested native download
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flow-agent-download-${{ matrix.os }}
          path: target/m12-download/
          if-no-files-found: error

  m11-evidence:
    name: M1.1 performance evidence
    needs: scope
    if: needs.scope.outputs.flow_agent == 'true'
    runs-on: ubuntu-24.04
    steps:
      - *checkout
      - *node
      - *rust

      - name: Run M1.1 performance evidence
        id: m11_evidence
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p target/m11-performance
          cargo run --locked -p flow-agent-core --release \
            --features m11-budget-evidence --example m11_budgets \
            > target/m11-performance/m11-performance-evidence.jsonl

      - name: Upload M1.1 performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m11-performance-evidence
          path: target/m11-performance/m11-performance-evidence.jsonl
          if-no-files-found: error

      - name: Enforce M1.1 evidence integrity
        if: always() && steps.m11_evidence.outcome != 'success'
        shell: bash
        run: exit 1

  liquid:
    name: Liquid (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.liquid == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    steps:
      - *checkout
      - *node
      - *mac-host
      - *rust

      # Its own job, so Flutter's tool directory never reaches the PATH of a privileged step.
      - name: Install pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: liquid/app/pubspec.yaml

      - name: Check the Liquid app
        if: matrix.os == 'ubuntu-24.04'
        working-directory: liquid/app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

      - name: Check the generated Liquid bridge
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          version=$(sed -n 's/^  flutter_rust_bridge: //p' liquid/app/pubspec.yaml)
          cargo install --locked "flutter_rust_bridge_codegen@$version"
          (cd liquid/app && flutter_rust_bridge_codegen generate)
          cargo fmt --all
          git diff --exit-code -- liquid
          test -z "$(git status --porcelain -- liquid)"

      - name: Check the Liquid key helper
        if: matrix.os == 'xcode-27'
        run: sh liquid/app/macos/LiquidKey/test.sh

      # Not required until it runs reliably (TESTING.md).
      - name: Build the Liquid macOS app
        if: matrix.os == 'xcode-27'
        continue-on-error: true
        working-directory: liquid/app
        run: |
          flutter pub get --enforce-lockfile
          flutter build macos --debug

  # Branch protection requires these two names. Each passes only when every job passed or
  # was skipped because the scope did not select it, so splitting jobs needs no ruleset change.
  gates:
    name: Flow Agent gates (${{ matrix.os }}) [${{ github.event_name }}]
    needs: [scope, checks, test, flow-agent, m11-evidence, liquid]
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    steps:
      - name: Require every selected job
        shell: python
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          scope = needs.pop("scope")
          outputs = scope["outputs"] if scope["result"] == "success" else {}
          selected_by = {"checks": "docs", "test": "product", "flow-agent": "flow_agent",
                         "m11-evidence": "flow_agent", "liquid": "liquid"}
          failed = [job for job, need in needs.items() if need["result"] != "success"
                    and not (need["result"] == "skipped" and outputs.get(selected_by[job]) == "false")]
          print(f"scope: {scope['result']}", *(f"{job}: {need['result']}" for job, need in needs.items()),
                sep="\n")
          if scope["result"] != "success" or failed:
              sys.exit(f"Failed or not run although selected: {', '.join(failed) or 'scope'}")
