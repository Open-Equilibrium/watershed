[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
version = 2
yanked = "deny"
# keyring 4.2 reaches the Secret Service through zbus 5, whose parts moved into zbus 6 and are
# no longer published on their own; these are maintenance notices, not vulnerabilities.
# Remove them once keyring uses zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant moved into zbus 6; keyring 4.2 needs zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names moved into zbus 6; keyring 4.2 needs zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive moved into zbus 6; keyring 4.2 needs zbus 5" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = [
    { crate = "winx@0.36.4", allow = ["Apache-2.0 WITH LLVM-exception"] },
    { crate = "foldhash@0.2.0", allow = ["Zlib"] },
    { crate = "sqlcipher-src@419.0.6+sqlcipher-4.19.0-sqlite-3.53.4-libtomcrypt-1.18.2", allow = ["blessing", "WTFPL"] },
    { crate = "zlib-rs@0.6.8", allow = ["Zlib"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
