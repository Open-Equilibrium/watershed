# Codex project config for trusted Watershed checkouts.
# Canonical repo rules live in AGENTS.md; security details live in SECURITY.md.
# Codex CLI alone parses and loads this repository-only setup. AGENTS.md defines
# its live-session verification and excludes it from Watershed review gates.

model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
model_verbosity = "low"
personality = "pragmatic"

# Keep big logs and diagnostics out of future turns.
tool_output_token_limit = 6000

# Auto-compact well before GPT's >272K premium-pricing zone.
model_auto_compact_token_limit = 150000

approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "disabled"

[sandbox_workspace_write]
network_access = true

[features]
multi_agent = true
hooks = true
prevent_idle_sleep = true
personality = true
fast_mode = false
goals = true

[agents]
max_concurrent_threads_per_session = 6
