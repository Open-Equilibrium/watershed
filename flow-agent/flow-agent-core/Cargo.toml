[package]
name = "flow-agent-core"
description = "Flow Agent core runtime."
build = "../build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[features]
m11-budget-evidence = []
m12-install-acceptance = []
m12-startup-evidence = []

[dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
core-policy.workspace = true
core-script.workspace = true
proto.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustix.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[[example]]
name = "m11_budgets"
required-features = ["m11-budget-evidence"]

[[example]]
name = "m12_executor_startup"
required-features = ["m12-startup-evidence"]

[[example]]
name = "custom_executor_conformance"
required-features = ["m12-startup-evidence"]
