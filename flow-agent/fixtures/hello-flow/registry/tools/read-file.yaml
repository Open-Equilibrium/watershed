tool:
  id: read-file
  name: ReadFile
  tool_kind: predefined-command
  command:
    command_id: agent-read
    argv: []
  allowed_parameters:
    - name: "--file"
      value_type: workspace-relative-path
      required: true
      value_pattern: "^[A-Za-z0-9_./-]+$"
      max_length: 128
  max_concurrent_processes_and_threads: 16
  runtime_profile: exact
  read_only_mounts: ["workspace"]
  writable_mounts: []
  network: deny
