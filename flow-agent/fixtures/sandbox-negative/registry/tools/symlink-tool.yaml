tool:
  id: symlink-tool
  name: SymlinkTool
  tool_kind: predefined-command
  command:
    command_id: agent-negative
    argv: ["symlink"]
  allowed_parameters: []
  max_concurrent_processes_and_threads: 16
  runtime_profile: exact
  read_only_mounts: ["workspace"]
  writable_mounts: ["workspace/links"]
  network: deny
