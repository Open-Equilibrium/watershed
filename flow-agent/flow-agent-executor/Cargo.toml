[package]
name = "flow-agent-executor"
description = "Official fail-closed Flow Agent sandbox Executor."
build = "../build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

# Crate-specific lints cannot be combined with `lints.workspace = true`.
[lints.clippy]
unwrap_used = "deny"

[dependencies]
proto.workspace = true
rustix = { workspace = true, features = ["std"] }
signal-hook.workspace = true

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true

[[bin]]
name = "flow-executor"
path = "src/main.rs"
test = false
